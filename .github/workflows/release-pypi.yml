name: release-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build artifacts (Linux manylinux wheel)
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: 2014
          args: --release --out dist

      - name: Build artifacts (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/waton/

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Flatten artifacts into dist/
        shell: bash
        run: |
          mkdir -p dist
          find dist-all -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -la dist

      - name: Publish package distributions to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: Create/Update GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write

    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate release notes body
        shell: bash
        run: |
          ver="${{ steps.tag.outputs.value }}"
          ver_no_v="${ver#v}"
          python - <<PY
          import re
          from pathlib import Path

          ver_no_v = "${ver_no_v}"
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"## \[" + re.escape(ver_no_v) + r"\][^\n]*\n(.*?)(?=\n## \[|\Z)", text, re.DOTALL)
          notes = match.group(1).strip() if match else "See CHANGELOG.md for details."

          header = f"## Waton v{ver_no_v} Release\n\nPublished to PyPI: https://pypi.org/project/waton/{ver_no_v}/\n\n### Installation\n\n\`\`\`bash\npip install waton=={ver_no_v}\n\`\`\`\n\n---\n\n"
          full_body = header + notes
          Path("release_notes.md").write_text(full_body, encoding="utf-8")
          PY

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.value }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "${tag}" --notes-file release_notes.md
          else
            gh release create "$tag" --title "${tag}" --notes-file release_notes.md
          fi
